<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0058bc">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230058bc%27/%3E%3Cpath d=%27M16 8l10 5-10 5-10-5z%27 fill=%27white%27/%3E%3Cpath d=%27M10 16v5c0 2 3 3 6 3s6-1 6-3v-5l-6 3z%27 fill=%27white%27/%3E%3C/svg%3E">
  <title>Les Aba Aqila</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Loading awal -->
  <div id="loadingOverlay" class="loading-overlay" role="status" aria-live="polite">
    <div class="spinner-border text-primary" aria-hidden="true"></div>
    <p class="mt-3 mb-0">Memuat aplikasi…</p>
  </div>

  <!-- Layar masuk (cadangan: email + PIN) -->
  <section id="viewLogin" class="auth-screen d-none">
    <div class="auth-card">
      <div class="brand-mark mb-3"><i class="bi bi-mortarboard-fill"></i></div>
      <h1 class="h4 fw-bold mb-1">Les Aba Aqila</h1>
      <p class="text-muted mb-4" id="loginPesan">Masuk dengan email dan PIN yang diberikan Admin.</p>
      <form id="formLogin" autocomplete="on">
        <label class="form-label" for="loginEmail">Email</label>
        <input class="form-control mb-3" type="email" id="loginEmail" name="email" autocomplete="username" required>
        <label class="form-label" for="loginPin">PIN</label>
        <input class="form-control mb-3" type="password" id="loginPin" name="pin" autocomplete="current-password" required>
        <button class="btn btn-pill btn-primary-app w-100" type="submit" id="btnLogin">Masuk</button>
      </form>
    </div>
  </section>

  <!-- Layar akses ditolak / galat -->
  <section id="viewDenied" class="auth-screen d-none">
    <div class="auth-card text-center">
      <div class="brand-mark brand-mark-danger mb-3"><i class="bi bi-shield-exclamation"></i></div>
      <h1 class="h4 fw-bold mb-2">Akses ditolak</h1>
      <p class="text-muted mb-4" id="deniedPesan"></p>
      <button class="btn btn-pill btn-tonal" data-act="muatUlang">Coba lagi</button>
    </div>
  </section>

  <!-- Cangkang aplikasi -->
  <div id="appShell" class="app-shell d-none">

    <aside id="sidebar" class="sidebar" aria-label="Navigasi utama">
      <div class="sidebar-brand">
        <span class="brand-mark brand-mark-sm"><i class="bi bi-mortarboard-fill"></i></span>
        <span class="brand-name" id="brandName">Les Aba Aqila</span>
      </div>
      <nav id="sidebarNav" class="sidebar-nav"></nav>
    </aside>

    <div class="app-main">
      <header class="topbar">
        <div class="topbar-brand d-lg-none">
          <span class="brand-mark brand-mark-sm"><i class="bi bi-mortarboard-fill"></i></span>
          <div class="lh-1">
            <div class="fw-bold" id="brandNameMobile">Les Aba Aqila</div>
            <small class="text-muted" id="pageTitleMobile">Beranda</small>
          </div>
        </div>
        <form class="search-pill d-none d-md-flex" id="formCari" role="search">
          <i class="bi bi-search" aria-hidden="true"></i>
          <input type="search" id="inputCari" placeholder="Cari siswa atau materi…" aria-label="Cari siswa atau materi">
        </form>
        <div class="topbar-actions">
          <button class="icon-btn" data-act="tema" aria-label="Ganti tema terang/gelap" id="btnTema"><i class="bi bi-moon-stars"></i></button>
          <div class="dropdown">
            <button class="icon-btn avatar-btn" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Menu akun"><i class="bi bi-person-fill"></i></button>
            <ul class="dropdown-menu dropdown-menu-end shadow-soft">
              <li class="px-3 py-2"><div class="fw-bold" id="menuNama">-</div><small class="text-muted" id="menuPeran">-</small></li>
              <li><hr class="dropdown-divider"></li>
              <li><button class="dropdown-item" data-act="keluar" id="menuKeluar"><i class="bi bi-box-arrow-right me-2"></i>Keluar</button></li>
            </ul>
          </div>
        </div>
      </header>

      <div class="search-mobile d-md-none">
        <form class="search-pill" id="formCariMobile" role="search">
          <i class="bi bi-search" aria-hidden="true"></i>
          <input type="search" id="inputCariMobile" placeholder="Cari siswa atau materi…" aria-label="Cari siswa atau materi">
        </form>
      </div>

      <main id="mainContent" class="main-content" tabindex="-1">
        <!-- Seluruh halaman disuntikkan di sini (SPA, URL tidak pernah berubah) -->
        <div id="app-container"></div>
      </main>
    </div>

    <nav id="bottomNav" class="bottom-nav" aria-label="Navigasi bawah"></nav>
  </div>

  <!-- Menu "Lainnya" (ponsel) -->
  <div class="offcanvas offcanvas-bottom sheet" tabindex="-1" id="sheetLainnya" aria-labelledby="sheetLainnyaJudul">
    <div class="offcanvas-header">
      <h2 class="offcanvas-title h6 fw-bold" id="sheetLainnyaJudul">Menu lainnya</h2>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Tutup"></button>
    </div>
    <div class="offcanvas-body pt-0"><div id="sheetLainnyaIsi" class="sheet-grid"></div></div>
  </div>

  <!-- Modal formulir umum -->
  <div class="modal fade" id="modalForm" tabindex="-1" aria-labelledby="formJudul" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <form class="modal-content" id="formModalForm" novalidate>
        <div class="modal-header">
          <h2 class="modal-title h5 fw-bold" id="formJudul">Formulir</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
        </div>
        <div class="modal-body" id="formBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-pill btn-ghost" data-bs-dismiss="modal">Batal</button>
          <button type="submit" class="btn btn-pill btn-primary-app" id="formSimpan">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal konfirmasi -->
  <div class="modal fade" id="modalKonfirmasi" tabindex="-1" aria-labelledby="konfJudul" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-header"><h2 class="modal-title h6 fw-bold" id="konfJudul">Konfirmasi</h2></div>
        <div class="modal-body" id="konfPesan"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-pill btn-ghost" data-bs-dismiss="modal">Batal</button>
          <button type="button" class="btn btn-pill btn-danger-app" id="konfYa">Ya, lanjutkan</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal pratinjau foto (tombol Tutup & Unduh, bukan tab baru) -->
  <div class="modal fade" id="modalFoto" tabindex="-1" aria-labelledby="fotoJudul" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h6 fw-bold" id="fotoJudul">Foto kegiatan</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
        </div>
        <div class="modal-body text-center" id="fotoIsi"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-pill btn-ghost" data-bs-dismiss="modal"><i class="bi bi-x-lg me-1"></i>Tutup</button>
          <a class="btn btn-pill btn-primary-app disabled" id="fotoUnduh" download="foto.jpg" href="#"><i class="bi bi-download me-1"></i>Unduh</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index:2000">
    <div id="appToast" class="toast app-toast" role="status" aria-live="polite" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body d-flex align-items-start gap-2"><i id="toastIkon" class="bi bi-info-circle-fill"></i><span id="toastPesan"></span></div>
        <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Tutup"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
